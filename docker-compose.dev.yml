name: vpn-service-dev

services:
  mysql-dev:
    image: mysql:8.0
    container_name: vpn_mysql_dev
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-your_mysql_root_password_here}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vpn_dev}
      MYSQL_USER: ${MYSQL_USER:-devuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-your_mysql_password_here}
    volumes:
      - mysql_data_dev:/var/lib/mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "127.0.0.1:3307:3306"
    networks:
      - vpn_dev_net

volumes:
  mysql_data_dev:

networks:
  vpn_dev_net:
    driver: bridge
