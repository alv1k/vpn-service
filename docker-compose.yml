name: vpn-service

services:
  mysql:
    image: mysql:8.0
    container_name: vpn_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: vpn
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - vpn_net

  x-ui:
    image: ghcr.io/mhsanaei/3x-ui:2.8.11
    container_name: x-ui
    restart: unless-stopped
    network_mode: host
    environment:
      - XRAY_VMESS_AEAD_FORCED=false
#      - WEB_PORT=51999
    volumes:
      - ./docker/x-ui-data:/etc/x-ui
      - ./docker/x-ui-cert:/root/cert
      - ./docker/x-ui-logs/access.log:/app/access.log
      - ./docker/x-ui-logs/error.log:/app/error.log
    cap_add:
      - NET_ADMIN

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    environment:
      PMA_HOST: vpn_mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      UPLOAD_LIMIT: 50M
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - vpn_net

volumes:
  mysql_data:

networks:
  vpn_net:
    driver: bridge
